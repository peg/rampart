name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with race detection and coverage
        if: runner.os == 'Linux'
        run: go test -race "-coverprofile=coverage.out" ./...

      - name: Test platform behavior
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Build
        run: go build -v ./cmd/rampart

      - name: PowerShell installers parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "docs/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $_" }
              exit 1
            }
          }

      - name: Installer scripts are synced
        if: runner.os == 'Linux'
        run: |
          cmp -s install.sh docs/install
          cmp -s install.sh docs/install.sh
          cmp -s install.sh scripts/install.sh
          sh -n install.sh
          sh -n docs/install
          sh -n docs/install.sh
          sh -n scripts/install.sh

      - name: Landing page sources are synced
        if: runner.os == 'Linux'
        run: cmp -s docs-site/index.html docs/index.html

      - name: Linux lab runner contract
        if: runner.os == 'Linux'
        run: make lab-runner-test

      - name: OpenClaw plugin regression tests
        if: runner.os != 'Windows'
        run: |
          node --test scripts/compat-openclaw-latest.test.mjs
          node internal/plugin/openclaw/smoke-test.mjs
          node internal/plugin/openclaw/tool-alias-test.mjs
          node internal/plugin/openclaw/provider-surface-replay.mjs
          node internal/plugin/openclaw/approval-regression.mjs
          node internal/plugin/openclaw/degraded-mode-test.mjs

      - name: Hermes plugin regression tests
        run: python -m unittest internal/plugin/hermes/test_hermes_plugin.py

      - name: Security assurance contract
        if: runner.os == 'Linux'
        run: make security-assurance

      - name: Policy checks
        if: runner.os == 'Linux'
        run: |
          for policy in standard paranoid yolo; do
            go run ./cmd/rampart policy check --config "policies/${policy}.yaml"
          done

      - name: Vulnerability check
        if: runner.os == 'Linux'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0 && govulncheck ./...

      - name: Benchmark
        if: runner.os == 'Linux'
        run: go test -bench=. -benchmem ./internal/engine/ ./internal/audit/

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-ubuntu
          path: coverage.out
          retention-days: 7

  docker-smoke:
    name: docker smoke (amd64 runtime + arm64 build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build amd64 image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg VERSION=ci-smoke \
            --build-arg COMMIT=${GITHUB_SHA::12} \
            --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t rampart:ci-smoke \
            .

      - name: Smoke test amd64 image
        run: |
          set -euo pipefail

          docker run --rm rampart:ci-smoke version | tee /tmp/rampart-docker-version.txt
          grep -F "rampart ci-smoke" /tmp/rampart-docker-version.txt

          cid="$(docker run -d -p 19090:9090 rampart:ci-smoke)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:19090/healthz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$cid"
          exit 1

      - name: Build arm64 image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --build-arg VERSION=ci-smoke \
            --build-arg COMMIT=${GITHUB_SHA::12} \
            --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --output=type=cacheonly \
            .

  release-dry-run:
    name: goreleaser snapshot (cross-platform build check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: GoReleaser snapshot (all platforms, no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-gate:
    name: CI gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, docker-smoke, release-dry-run]
    steps:
      - name: Require every CI job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
          RELEASE_RESULT: ${{ needs.release-dry-run.result }}
        run: |
          for result in "$TEST_RESULT" "$DOCKER_RESULT" "$RELEASE_RESULT"; do
            if [ "$result" != success ]; then
              echo "Required CI job result: $result"
              exit 1
            fi
          done
