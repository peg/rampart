name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: Set up Node
        if: runner.os != 'Windows'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download dependencies
        run: go mod download

      - name: Module files are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Go files are formatted
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Workflow files are valid
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Test with race detection and coverage
        if: runner.os == 'Linux'
        run: go test -race "-coverprofile=coverage.out" ./...

      - name: Test platform behavior
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Build
        run: go build -v ./cmd/rampart

      - name: Build and test preload library
        if: runner.os != 'Windows'
        working-directory: preload
        run: make clean test

      - name: Test live LD_PRELOAD contract
        if: runner.os == 'Linux'
        working-directory: preload
        run: bash test_preload.sh

      - name: PowerShell installers parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "docs/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $_" }
              exit 1
            }
          }

      - name: PowerShell installers are synced
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-FileHash install.ps1 -Algorithm SHA256).Hash -ne
              (Get-FileHash docs/install.ps1 -Algorithm SHA256).Hash) {
            Write-Error "install.ps1 and docs/install.ps1 differ"
            exit 1
          }

      - name: Test Windows installer behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-installer-windows.ps1

      - name: Installer scripts are valid and synced
        if: runner.os == 'Linux'
        run: |
          cmp -s install.sh docs/install
          cmp -s install.sh docs/install.sh
          cmp -s install.sh scripts/install.sh
          sh -n install.sh
          sh -n docs/install
          sh -n docs/install.sh
          sh -n scripts/install.sh

      - name: Test Unix installer integrity handling
        if: runner.os != 'Windows'
        run: bash scripts/test-installers.sh

      - name: Landing page sources are synced
        if: runner.os == 'Linux'
        run: cmp -s docs-site/index.html docs/index.html

      - name: API reference uses one canonical source
        if: runner.os == 'Linux'
        run: sh scripts/check-api-reference.sh

      - name: Linux lab runner contract
        if: runner.os == 'Linux'
        run: make lab-runner-test

      - name: OpenClaw plugin regression tests
        if: runner.os != 'Windows'
        run: |
          node --test scripts/compat-openclaw-latest.test.mjs
          node internal/plugin/openclaw/smoke-test.mjs
          node internal/plugin/openclaw/tool-alias-test.mjs
          node internal/plugin/openclaw/provider-surface-replay.mjs
          node internal/plugin/openclaw/approval-regression.mjs
          node internal/plugin/openclaw/degraded-mode-test.mjs

      - name: Hermes plugin regression tests
        run: python -m unittest internal/plugin/hermes/test_hermes_plugin.py

      - name: Hermes compatibility harness isolation
        if: runner.os == 'Linux'
        run: python -m unittest scripts/test_compat_hermes_env.py

      - name: Policy checks
        if: runner.os == 'Linux'
        run: |
          for policy in standard paranoid yolo; do
            go run ./cmd/rampart policy check --config "policies/${policy}.yaml"
          done

      - name: Vulnerability check
        if: runner.os == 'Linux'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0 && govulncheck ./...

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-ubuntu
          path: coverage.out
          retention-days: 7

  docker-smoke:
    name: docker smoke (amd64 runtime + arm64 build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build amd64 image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg VERSION=ci-smoke \
            --build-arg COMMIT="${GITHUB_SHA::12}" \
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t rampart:ci-smoke \
            .

      - name: Smoke test amd64 image
        run: bash scripts/docker-smoke.sh rampart:ci-smoke ci-smoke

      - name: Build arm64 image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --build-arg VERSION=ci-smoke \
            --build-arg COMMIT="${GITHUB_SHA::12}" \
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output=type=cacheonly \
            .

  release-dry-run:
    name: goreleaser snapshot (cross-platform build check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: GoReleaser snapshot (all platforms, no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # v2.16+ rejects the legacy Formula publisher. Keep existing
          # Homebrew users upgradeable until the tap migration is coordinated.
          version: "v2.15.3"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-sdk:
    name: Python SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install SDK and test dependencies
        working-directory: sdks/python
        run: python -m pip install '.[dev]'

      - name: Test SDK
        working-directory: sdks/python
        run: python -m pytest

      - name: Check SDK quality
        if: matrix.python-version == '3.9'
        working-directory: sdks/python
        run: |
          python -m black --check rampart tests
          python -m isort --check-only rampart tests
          python -m flake8 rampart tests
          python -m mypy rampart

      - name: Test integrations on minimum Python
        if: matrix.python-version == '3.9'
        run: |
          python -m unittest internal/plugin/hermes/test_hermes_plugin.py
          python -m unittest scripts/test_compat_hermes_env.py

      - name: Build SDK wheel
        if: matrix.python-version == '3.12'
        working-directory: sdks/python
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/rampart-sdk-dist" .

  ci-gate:
    name: CI gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, docker-smoke, release-dry-run, python-sdk]
    steps:
      - name: Require every CI job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
          RELEASE_RESULT: ${{ needs.release-dry-run.result }}
          PYTHON_SDK_RESULT: ${{ needs.python-sdk.result }}
        run: |
          for result in "$TEST_RESULT" "$DOCKER_RESULT" "$RELEASE_RESULT" "$PYTHON_SDK_RESULT"; do
            if [ "$result" != success ]; then
              echo "Required CI job result: $result"
              exit 1
            fi
          done
