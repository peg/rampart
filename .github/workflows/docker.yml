name: Docker

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact validated SemVer tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require strict SemVer tag from main
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$RELEASE_TAG" =~ $semver ]]; then
            echo "Docker release tag must be strict SemVer prefixed with v: $RELEASE_TAG" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$checked_out_sha" != "$tag_sha" ]]; then
            echo "Checked-out release commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$checked_out_sha" origin/main

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/peg/rampart
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(inputs.release_tag, '-') }}
            type=raw,value=latest,enable=${{ !contains(inputs.release_tag, '-') }}

      - name: Compute build metadata
        id: build
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          printf 'version=%s\ncommit=%s\ndate=%s\n' \
            "${RELEASE_TAG#v}" \
            "$(git rev-parse --short=12 HEAD)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build local image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rampart:release-smoke
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha

      - name: Smoke test local Docker image
        env:
          IMAGE: rampart:release-smoke
          VERSION: ${{ steps.build.outputs.version }}
        run: bash scripts/docker-smoke.sh "$IMAGE" "$VERSION"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch manifest
        env:
          IMAGE: ghcr.io/peg/rampart:${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/rampart-docker-manifest.txt
          grep -F 'linux/amd64' /tmp/rampart-docker-manifest.txt
          grep -F 'linux/arm64' /tmp/rampart-docker-manifest.txt
