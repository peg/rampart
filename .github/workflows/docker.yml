name: Docker

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact validated SemVer tag to publish
        required: true
        type: string
      release_sha:
        description: Commit the caller validated; the image is built from it and only it
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require strict SemVer tag from main at the validated commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$RELEASE_TAG" =~ $semver ]]; then
            echo "Docker release tag must be strict SemVer prefixed with v: $RELEASE_TAG" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$RELEASE_SHA" ]]; then
            echo "Checked-out commit $checked_out_sha is not the validated $RELEASE_SHA" >&2
            exit 1
          fi
          bash scripts/check-release-tag.sh "$RELEASE_TAG" "$RELEASE_SHA"
          git merge-base --is-ancestor "$checked_out_sha" origin/main

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/peg/rampart
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(inputs.release_tag, '-') }}
            type=raw,value=latest,enable=${{ !contains(inputs.release_tag, '-') }}

      - name: Compute build metadata
        id: build
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          printf 'version=%s\ncommit=%s\ndate=%s\n' \
            "${RELEASE_TAG#v}" \
            "${RELEASE_SHA:0:12}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once and push by digest only. The smoke test and the published
      # tags then refer to this exact multi-arch image, never to a rebuild.
      - name: Build and push multi-arch image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/peg/rampart,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        env:
          IMAGE: ghcr.io/peg/rampart@${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          bash scripts/docker-smoke.sh "$IMAGE" "$VERSION"

      - name: Publish tags for the tested digest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # The tag must still name the validated commit at publication time.
          bash scripts/check-release-tag.sh "$RELEASE_TAG" "$RELEASE_SHA"
          args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && args+=(-t "$tag")
          done <<<"$TAGS"
          (( ${#args[@]} > 0 )) || { echo "No image tags computed" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "ghcr.io/peg/rampart@$DIGEST"

      - name: Verify published manifest is the tested digest
        env:
          IMAGE: ghcr.io/peg/rampart:${{ steps.build.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/rampart-docker-manifest.txt
          published="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ "$published" != "$DIGEST" ]]; then
            echo "Published $IMAGE is $published, not the tested $DIGEST" >&2
            exit 1
          fi
          grep -F 'linux/amd64' /tmp/rampart-docker-manifest.txt
          grep -F 'linux/arm64' /tmp/rampart-docker-manifest.txt
