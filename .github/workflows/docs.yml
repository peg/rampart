name: Deploy Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs-requirements.txt'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs-requirements.txt'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r docs-requirements.txt

      - name: Install D2
        env:
          D2_VERSION: v0.7.1
          D2_SHA256: eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
        run: |
          archive="/tmp/d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "$D2_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/d2-${D2_VERSION}/bin/d2" "$HOME/.local/bin/d2"

      - name: Build docs
        run: mkdocs build
        env:
          PATH: /home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      # Deploy to peg/rampart-docs (the repo that serves docs.rampart.sh via GitHub Pages).
      # Requires a PAT with contents:write on peg/rampart-docs stored as DOCS_DEPLOY_TOKEN.
      - name: Push to peg/rampart-docs
        if: github.event_name != 'pull_request'
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd /tmp
          git clone --depth=1 https://x-access-token:${DOCS_DEPLOY_TOKEN}@github.com/peg/rampart-docs.git rampart-docs
          rsync -a --delete --exclude='.git' "${GITHUB_WORKSPACE}/site/" rampart-docs/
          cd rampart-docs
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "docs: deploy from peg/rampart@${GITHUB_SHA::8}"
          git push origin gh-pages
