name: Deploy Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/API-REFERENCE.md'
      - 'docs-requirements.txt'
      - 'mkdocs.yml'
      - 'scripts/check-api-reference.sh'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/API-REFERENCE.md'
      - 'docs-requirements.txt'
      - 'mkdocs.yml'
      - 'scripts/check-api-reference.sh'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check canonical API reference wrapper
        run: sh scripts/check-api-reference.sh

      - name: Install Python dependencies
        run: pip install -r docs-requirements.txt

      - name: Install D2
        env:
          D2_VERSION: v0.7.1
          D2_SHA256: eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
        run: |
          archive="/tmp/d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "$D2_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/d2-${D2_VERSION}/bin/d2" "$HOME/.local/bin/d2"

      - name: Build docs
        run: mkdocs build
        env:
          PATH: /home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      # Deploy to peg/rampart-docs (the repo that serves docs.rampart.sh via GitHub Pages).
      # Requires a PAT with contents:write on peg/rampart-docs stored as DOCS_DEPLOY_TOKEN.
      - name: Checkout docs deployment branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peg/rampart-docs
          ref: gh-pages
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: rampart-docs

      - name: Push to peg/rampart-docs
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rsync -a --delete --exclude='.git' \
            "${GITHUB_WORKSPACE}/site/" \
            "${GITHUB_WORKSPACE}/rampart-docs/"
          cd "${GITHUB_WORKSPACE}/rampart-docs"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "docs: deploy from peg/rampart@${GITHUB_SHA::8}"
          git push origin gh-pages
