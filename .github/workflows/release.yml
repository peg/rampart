name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require a commit from main
        run: git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"

      - name: Vet
        run: go vet ./...

      - name: Test with race detection
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Test platform behavior
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Build
        run: go build ./cmd/rampart

      - name: Build and test preload library
        if: runner.os != 'Windows'
        working-directory: preload
        run: make clean test

      - name: Test live LD_PRELOAD contract
        if: runner.os == 'Linux'
        working-directory: preload
        run: bash test_preload.sh

      - name: PowerShell installers parse and match
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "docs/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $_" }
              exit 1
            }
          }
          if ((Get-FileHash install.ps1 -Algorithm SHA256).Hash -ne
              (Get-FileHash docs/install.ps1 -Algorithm SHA256).Hash) {
            Write-Error "install.ps1 and docs/install.ps1 differ"
            exit 1
          }

  assurance:
    name: Security assurance contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Match the SDK's declared minimum so mypy also checks Python 3.9
          # syntax and dependency compatibility. CI tests both 3.9 and 3.12.
          python-version: '3.9'
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install Python SDK and test dependencies
        working-directory: sdks/python
        run: python -m pip install '.[dev]'

      - name: Test and build Python SDK
        working-directory: sdks/python
        run: |
          python -m pytest
          python -m black --check rampart tests
          python -m isort --check-only rampart tests
          python -m flake8 rampart tests
          python -m mypy rampart
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/rampart-sdk-dist" .

      - name: Run security assurance suite
        run: make security-assurance

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, assurance]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # v2.16+ rejects the legacy Formula publisher. Keep existing
          # Homebrew users upgradeable until the tap migration is coordinated.
          version: "v2.15.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
