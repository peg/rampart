name: Render Diagrams

on:
  pull_request:
    paths:
      - 'docs/architecture.d2'
      - 'docs/architecture.svg'
      - '.github/workflows/render-diagrams.yml'
  push:
    branches: [main, staging]
    paths:
      - 'docs/architecture.d2'
      - 'docs/architecture.svg'
      - '.github/workflows/render-diagrams.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install D2
        env:
          D2_VERSION: v0.7.1
          D2_SHA256: eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
        run: |
          archive="/tmp/d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "$D2_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/d2-${D2_VERSION}/bin/d2" "$HOME/.local/bin/d2"

      - name: Verify architecture.svg is current
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          d2 --theme 200 --layout elk --pad 40 \
            docs/architecture.d2 \
            "$RUNNER_TEMP/architecture.svg"
          cmp -s docs/architecture.svg "$RUNNER_TEMP/architecture.svg" || {
            echo "docs/architecture.svg is stale; render docs/architecture.d2 and commit the result" >&2
            exit 1
          }
