name: Upstream Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  hermes-latest:
    name: Hermes latest isolated plugin gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate against latest Hermes Agent
        run: python scripts/compat-hermes-latest.py

  openclaw-latest:
    name: OpenClaw latest isolated plugin gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Latest OpenClaw requires >=22.22.3 or a supported Node 24 release.
          node-version: '24'

      - name: Validate against latest OpenClaw
        run: node scripts/compat-openclaw-latest.mjs --npm-latest
