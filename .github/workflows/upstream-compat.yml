name: Upstream Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  copilot-latest:
    name: Copilot CLI latest package + adapter gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Check latest package startup and Rampart adapter
        run: node scripts/compat-copilot-latest.mjs

  gemini-latest:
    name: Gemini CLI latest package + adapter gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Check latest package startup and Rampart adapter
        run: node scripts/compat-gemini-latest.mjs

  hermes-latest:
    name: Hermes latest isolated plugin gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate against latest Hermes Agent
        run: python scripts/compat-hermes-latest.py

  openclaw-latest:
    name: OpenClaw latest source + container gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Latest OpenClaw requires >=22.22.3 or a supported Node 24 release.
          node-version: '24'

      - name: Validate source compatibility against latest OpenClaw
        run: node scripts/compat-openclaw-latest.mjs --npm-latest

      - name: Build candidate Rampart
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/rampart-openclaw-candidate" ./cmd/rampart

      - name: Validate zero-configuration protection in latest official image
        run: |
          scripts/lab/openclaw-container-acceptance.sh \
            --rampart "$RUNNER_TEMP/rampart-openclaw-candidate" \
            --artifact-dir "$RUNNER_TEMP/openclaw-container-acceptance"

      - name: Upload OpenClaw compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-latest-compatibility
          path: ${{ runner.temp }}/openclaw-container-acceptance
          if-no-files-found: warn
          retention-days: 14
