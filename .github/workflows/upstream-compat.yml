name: Upstream Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cline-latest:
    name: Cline CLI latest package + adapter gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check latest package startup and Rampart adapter
        run: node scripts/compat-cline-latest.mjs

  copilot-latest:
    name: Copilot CLI latest package + adapter gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check latest package startup and Rampart adapter
        run: node scripts/compat-copilot-latest.mjs

  gemini-latest:
    name: Gemini CLI latest package + adapter gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check latest package startup and Rampart adapter
        run: node scripts/compat-gemini-latest.mjs

  hermes-latest:
    name: Hermes latest isolated plugin gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate against latest Hermes Agent
        run: python scripts/compat-hermes-latest.py

  openclaw-latest:
    name: OpenClaw latest source + container gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Latest OpenClaw requires >=22.22.3 or a supported Node 24 release.
          node-version: '24'

      - name: Validate source compatibility against latest OpenClaw
        run: node scripts/compat-openclaw-latest.mjs --npm-latest

      - name: Build candidate Rampart
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/rampart-openclaw-candidate" ./cmd/rampart

      - name: Validate zero-configuration protection with latest stable package
        run: |
          scripts/compat-openclaw-container.sh \
            --rampart "$RUNNER_TEMP/rampart-openclaw-candidate" \
            --artifact-dir "$RUNNER_TEMP/openclaw-container-acceptance"

      - name: Upload OpenClaw compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-latest-compatibility
          path: ${{ runner.temp }}/openclaw-container-acceptance
          if-no-files-found: warn
          retention-days: 14

  openclaw-beta:
    name: OpenClaw beta package advisory gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Beta breakage is early warning for maintainers, not a claim that an
    # unreleased upstream version is supported by the current Rampart release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate source compatibility against OpenClaw beta
        run: node scripts/compat-openclaw-latest.mjs --npm-latest --openclaw-package=openclaw@beta
