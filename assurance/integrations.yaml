schema_version: rampart.assurance.v1
baseline_release: v1.4.0
reviewed_at: "2026-07-25"

# This manifest records the guarantees Rampart can support with evidence today.
# "tested" means the Rampart adapter or mapping is exercised in isolation.
# "verified" means a completed live host-boundary run is recorded as evidence,
# or the installed integration exposes an active safe host-boundary verifier.
integrations:
  - id: openclaw
    display_name: OpenClaw
    support_tier: verified
    setup_command: rampart protect openclaw
    boundary: native_plugin
    platforms: [linux, macos]
    service_required: true
    upstream_ci: rolling_latest
    coverage:
      shell: verified
      file_read: verified
      file_write: verified
      network: partial
      mcp: unknown
      subagents: partial
    degraded:
      policy_unavailable: deny
      adapter_error: unknown
      timeout: deny
    approval: native
    verification:
      level: active
      command: rampart verify openclaw
      safe_canaries: true
      host_boundary: true
    evidence:
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Verification rejects incomplete or stale plugin canary results.
      - path: internal/plugin/openclaw/provider-surface-replay.mjs
        kind: integration
        proves: Provider aliases and action consequences reach the canonical policy surface.
      - path: internal/plugin/openclaw/degraded-mode-test.mjs
        kind: failure_injection
        proves: Managed sensitive tools deny on service errors, malformed replies, and timeouts.
      - path: scripts/compat-openclaw-latest.mjs
        kind: upstream_latest
        proves: The bundled plugin contract is checked against the latest published OpenClaw.
      - path: scripts/lab/openclaw-container-acceptance.sh
        kind: live
        proves: A disposable OpenClaw installation exercises the real plugin boundary.
    limitations:
      - Rampart evaluates OpenClaw tool calls, not arbitrary network syscalls made inside an allowed process.
      - Host behavior after an uncaught plugin exception is not yet independently proven fail-closed.
      - MCP and delegated-agent coverage need dedicated live canaries.

  - id: claude_code
    display_name: Claude Code
    support_tier: supported
    setup_command: rampart setup claude-code
    boundary: native_hook
    platforms: [linux, macos, windows]
    service_required: false
    upstream_ci: none
    coverage:
      shell: verified
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: partial
    degraded:
      policy_unavailable: local
      adapter_error: host_defined
      timeout: host_defined
    approval: native
    verification:
      level: active
      command: scripts/compat-claude-host.sh --yes --rampart-bin ./rampart
      safe_canaries: true
      host_boundary: true
    evidence:
      - path: cmd/rampart/cli/hook_test.go
        kind: unit
        proves: Claude hook payloads map to structured allow, ask, and deny responses.
      - path: cmd/rampart/cli/hook_ask_test.go
        kind: integration
        proves: Invalid policy and malformed input fail closed through the hook protocol.
      - path: cmd/rampart/cli/setup_test.go
        kind: unit
        proves: Setup preserves existing settings while installing required hook events.
      - path: scripts/compat-claude-host.sh
        kind: integration
        proves: An opt-in state-isolated harness can prove deny, execution, and pre/post correlation through a real Claude Code process.
      - path: assurance/evidence/claude-host-2026-07-25.json
        kind: live
        proves: A completed macOS host run records blocked deny execution, successful allow execution, pre/post tool-call correlation, and isolated source-state use on Claude Code 2.1.220.
    limitations:
      - No rolling latest-Claude compatibility job currently exercises the installed host.
      - rampart verify policy proves policy behavior but does not prove Claude loaded or invoked the hook.
      - Re-running the opt-in host proof requires an authenticated Claude Code installation; on macOS its disposable home needs an ephemeral CLAUDE_CODE_OAUTH_TOKEN because it cannot use the source home's Keychain login directly.
      - Claude Code 2.1.220 is the latest version reviewed; its documented hook-visible tools are mapped, and in enforce mode future unknown PreToolUse tools deny until Rampart is updated.
      - Host-owned or server-side actions that do not emit lifecycle hooks are outside this boundary; Claude's EndConversation tool is a documented benign example.
      - Subagent, hook-crash, and host-timeout behavior need live conformance tests.

  - id: cline
    display_name: Cline
    support_tier: supported
    setup_command: rampart setup cline
    boundary: native_hook
    platforms: [linux, macos]
    service_required: false
    upstream_ci: none
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: unknown
      subagents: unknown
    degraded:
      policy_unavailable: local
      adapter_error: host_defined
      timeout: host_defined
    approval: block_and_retry
    verification:
      level: policy_only
      command: rampart verify policy
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/cline_test.go
        kind: unit
        proves: Setup installs the Cline pre- and post-tool hook scripts.
      - path: cmd/rampart/cli/hook_test.go
        kind: unit
        proves: Cline hook payloads map to allow and cancellation responses.
    limitations:
      - No rolling latest-Cline compatibility job currently exercises the installed host.
      - The installed hook scripts require Bash; native Windows behavior is not currently claimed.
      - Cline has no native Rampart approval-resume path; ask decisions cancel with context.

  - id: codex_cli
    display_name: Codex
    support_tier: supported
    setup_command: rampart setup codex
    boundary: native_hook
    platforms: [linux, macos, windows]
    service_required: false
    upstream_ci: none
    coverage:
      shell: verified
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: partial
    degraded:
      policy_unavailable: deny
      adapter_error: host_defined
      timeout: host_defined
    approval: external
    verification:
      level: active
      command: rampart verify codex
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_codex_test.go
        kind: integration
        proves: Codex lifecycle payloads, multi-file patches, and supported deny responses are exercised.
      - path: cmd/rampart/cli/setup_codex_test.go
        kind: unit
        proves: Setup preserves existing hooks, migrates the legacy wrapper, and installs cross-platform commands.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification checks installed hook configuration and directly invokes the adapter with a destructive canary that must deny.
      - path: scripts/compat-codex-host.sh
        kind: live
        proves: An opt-in credential-isolated harness proves deny and allow behavior through a real ephemeral Codex process.
      - path: assurance/evidence/codex-host-2026-07-25.json
        kind: live
        proves: A completed macOS host run records blocked deny execution, successful allow execution, pre/post tool-call correlation, and isolated source-state use on Codex CLI 0.145.0.
    limitations:
      - The ordinary verification command exercises installed configuration and the adapter; the real Codex host check is a separate opt-in model invocation and is not run in regular CI.
      - Codex hosted tools and specialized local tool paths that opt out of lifecycle hooks are not covered.
      - Approval actions require rampart serve because Codex PreToolUse does not currently accept an ask decision.
      - Codex controls hook timeout behavior; a host timeout cannot be claimed fail-closed.
      - The opt-in host harness is exercised on macOS/Linux; a physical Windows Codex host run is still pending.

  - id: hermes
    display_name: Hermes Agent
    support_tier: experimental
    setup_command: rampart setup hermes
    boundary: native_plugin
    platforms: [linux, macos]
    service_required: true
    upstream_ci: rolling_latest
    coverage:
      shell: verified
      file_read: tested
      file_write: tested
      network: tested
      mcp: unknown
      subagents: unknown
    degraded:
      policy_unavailable: mixed
      adapter_error: allow
      timeout: mixed
    approval: block_and_retry
    verification:
      level: static
      command: rampart doctor
      safe_canaries: false
      host_boundary: false
    evidence:
      - path: internal/plugin/hermes/test_hermes_plugin.py
        kind: unit
        proves: Tool normalization, redaction, allow, deny, ask, and service failure are tested.
      - path: scripts/compat-hermes-latest.py
        kind: upstream_latest
        proves: Latest Hermes discovery, dispatcher decisions, degraded mode, and multi-path deny-wins behavior are checked in isolation.
      - path: scripts/compat-hermes-host.sh
        kind: integration
        proves: An opt-in auth-minimized harness proves deny and allowed execution through a real isolated Hermes model/tool loop.
      - path: assurance/evidence/hermes-host-2026-07-24.json
        kind: live
        proves: A completed Linux host run records blocked deny execution, successful allow execution, pre-tool audit correlation, and isolated source-state use on Hermes Agent 0.19.0.
    limitations:
      - Hermes documents that a crashing plugin callback is skipped and the agent continues.
      - Hermes approval observer hooks cannot answer or resume an approval.
      - Read-only tools may be configured fail-open when Rampart is unavailable.
      - Gateway, delegated-agent, and approved-execution E2E are not yet present.

  - id: gemini_cli
    display_name: Gemini CLI
    support_tier: supported
    setup_command: rampart setup gemini
    boundary: native_hook
    platforms: [linux, macos]
    service_required: false
    upstream_ci: rolling_latest
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: partial
    degraded:
      policy_unavailable: local
      adapter_error: host_defined
      timeout: host_defined
    approval: external
    verification:
      level: active
      command: rampart verify gemini
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_gemini_test.go
        kind: unit
        proves: Documented Gemini tool payloads normalize to policy surfaces, unknown future pre-call tools fail closed, and deny/approval responses use the supported hook schema.
      - path: cmd/rampart/cli/setup_gemini_test.go
        kind: unit
        proves: Setup preserves unrelated user settings and hooks, is idempotent, supports clean removal, and refuses malformed configuration by default.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification invokes the real adapter with a destructive canary and requires both a structured denial and session-correlated audit record.
      - path: scripts/compat-gemini-latest.mjs
        kind: upstream_latest
        proves: The latest published Gemini CLI starts with Rampart's generated settings and the candidate adapter returns the documented destructive-tool denial schema.
    limitations:
      - This targets the local Gemini CLI hook host across individual, organization, Google Cloud, and API-key authentication; Gemini Code Assist IDE agent mode and Antigravity CLI compatibility are not claimed.
      - The ordinary verifier exercises installed configuration and Rampart's adapter, not a real Gemini model/tool invocation.
      - Gemini hooks do not currently expose a native ask result, so approval actions require rampart serve and deny when that service is unavailable.
      - An unexpected hook crash or host timeout follows Gemini CLI behavior and is not claimed fail-closed.
      - Physical Windows host proof and completed authenticated live-host proof are still pending.

  - id: github_copilot
    display_name: GitHub Copilot CLI / VS Code
    support_tier: supported
    setup_command: rampart setup copilot
    boundary: native_hook
    platforms: [linux, macos, windows]
    service_required: false
    upstream_ci: rolling_latest
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: partial
    degraded:
      policy_unavailable: local
      adapter_error: mixed
      timeout: mixed
    approval: native
    verification:
      level: active
      command: rampart verify copilot
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_copilot_test.go
        kind: unit
        proves: Copilot CLI and VS Code payloads normalize to shared policy surfaces, multi-file writes evaluate every path, unknown future pre-call tools fail closed, and decisions include both host schemas.
      - path: cmd/rampart/cli/setup_copilot_test.go
        kind: unit
        proves: Setup generates the shared cross-platform user hook idempotently, refuses to overwrite foreign files, and removes only Rampart-owned configuration.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification invokes the real adapter with a destructive canary and requires CLI and VS Code denials plus session-correlated audit output.
      - path: scripts/compat-copilot-latest.mjs
        kind: upstream_latest
        proves: The latest published Copilot CLI starts with isolated state while the generated shared hook schema and destructive denial adapter are checked.
    limitations:
      - VS Code agent hooks are an upstream Preview feature and their configuration or behavior may change.
      - Copilot CLI command-hook crashes and non-zero exits fail closed for PreToolUse, but every CLI hook timeout is fail-open, including administrator policy hooks.
      - VS Code blocks on exit code 2 but treats other non-zero exits as warnings; Rampart returns structured decisions with exit code 0, and does not claim unexpected VS Code adapter crashes fail closed.
      - The machine-wide --policy hook is supported by Copilot CLI only; VS Code requires the user hook plus separately managed VS Code enterprise settings and file deployment.
      - User hooks can be modified by the user. Enterprise enforcement requires administrator-owned Copilot CLI policy hooks or OS/MDM controls around the VS Code hook file.
      - The ordinary verifier exercises installed configuration and the Rampart adapter, not an authenticated model/tool invocation through either host.
      - Copilot cloud agent does not load local user or administrator hook files; repository hooks require a separately deployed repository configuration.
