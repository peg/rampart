schema_version: rampart.assurance.v2
baseline_release: v1.8.0
reviewed_at: "2026-08-17"

# Version 2 uses the canonical Rampart command target as each integration id
# and requires an explicit declaration of bare `rampart protect` eligibility.
# This manifest records the guarantees Rampart can support with evidence today.
# "tested" means the Rampart adapter or mapping is exercised in isolation.
# "verified" means the installed integration exposes an active, safe verifier
# for the claimed host boundary.
integrations:
  - id: openclaw
    display_name: OpenClaw
    support_tier: verified
    setup_command: rampart protect openclaw
    boundary: native_plugin
    platforms: [linux, macos]
    auto_protect: true
    service_required: true
    upstream_ci: rolling_latest
    coverage:
      shell: verified
      file_read: verified
      file_write: verified
      network: partial
      mcp: not_covered
      subagents: partial
    degraded:
      policy_unavailable: deny
      adapter_error: host_defined
      timeout: deny
    approval: native
    verification:
      level: active
      command: rampart verify openclaw
      safe_canaries: true
      host_boundary: true
    evidence:
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Verification checks managed configuration and rejects incomplete or stale canary results from the loaded plugin's gateway method.
      - path: internal/plugin/openclaw/provider-surface-replay.mjs
        kind: integration
        proves: Current OpenClaw built-ins and provider aliases reach typed policy surfaces, action consequences remain conservative, unknown tools fail closed locally, and every apply_patch target is evaluated with deny-wins behavior.
      - path: internal/plugin/openclaw/degraded-mode-test.mjs
        kind: failure_injection
        proves: The default plugin configuration denies every tool on service errors, malformed replies, and timeouts; explicitly opted-out tools fail open.
      - path: scripts/compat-openclaw-latest.mjs
        kind: upstream_latest
        proves: The bundled plugin contract is checked against the latest published OpenClaw.
      - path: scripts/compat-openclaw-container.sh
        kind: upstream_latest
        proves: A disposable OpenClaw installation resolves the stable npm release and exercises the real plugin boundary.
    limitations:
      - rampart verify openclaw reaches the installed gateway plugin and its policy mapping; it does not run an authenticated agent turn or prove tool execution and approval resume through the host dispatcher.
      - Rampart evaluates OpenClaw tool calls, not arbitrary network syscalls made inside an allowed process.
      - Host behavior after an uncaught plugin exception is not yet independently proven fail-closed.
      - Unknown plugin and MCP tool names deny until Rampart has an explicit typed mapping for them.
      - OpenClaw currently gives modifying hooks the original event rather than an authoritative post-composition parameter view; other parameter-mutating plugins are part of the trusted host boundary.
      - OpenClaw before_tool_call does not expose host CWD; relative file enforcement depends on host-supplied paths and derivedPaths, so absolute or recursive policy patterns are recommended.
      - OpenClaw after_tool_call is observational, so the native plugin does not claim blocking response redaction.
      - MCP and delegated-agent coverage need dedicated live canaries.

  - id: claude-code
    display_name: Claude Code
    support_tier: supported
    setup_command: rampart setup claude-code
    boundary: native_hook
    platforms: [linux, macos, windows]
    auto_protect: true
    service_required: false
    upstream_ci: none
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: partial
    degraded:
      policy_unavailable: local
      adapter_error: host_defined
      # A command-hook timeout supplies no veto; Claude's own permissions still apply.
      timeout: allow
    approval: native
    verification:
      level: active
      command: rampart verify claude-code
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_test.go
        kind: unit
        proves: Claude hook payloads map to structured allow, ask, and deny responses.
      - path: cmd/rampart/cli/hook_mcp_test.go
        kind: unit
        proves: Claude MCP tool names pass through the shared native-hook classifier, including conservative destructive-tool classification.
      - path: cmd/rampart/cli/hook_ask_test.go
        kind: integration
        proves: Invalid policy and malformed input fail closed through the hook protocol.
      - path: cmd/rampart/cli/setup_test.go
        kind: unit
        proves: Setup preserves existing settings while installing required hook events.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Verification checks installed hook configuration and directly invokes the adapter with a non-executing denial canary; it does not launch Claude.
    limitations:
      - No rolling latest-Claude compatibility job currently exercises the installed host.
      - rampart verify claude-code proves installed configuration and adapter behavior but does not prove Claude loaded or invoked the hook.
      - Documented hook-visible tools are mapped, and in enforce mode future unknown PreToolUse tools deny until Rampart is updated.
      - Host-owned or server-side actions that do not emit lifecycle hooks are outside this boundary; Claude's EndConversation tool is a documented benign example.
      - Claude's documented command-hook timeout and launch-failure behavior does not block PreToolUse; adapter failures without a blocking exit or valid denial also permit normal host permission processing.
      - Subagent and host-failure contracts have not been proven through authenticated live conformance tests.

  - id: cline
    display_name: Cline
    support_tier: supported
    setup_command: rampart setup cline
    boundary: native_hook
    platforms: [linux, macos, windows]
    auto_protect: true
    service_required: false
    upstream_ci: rolling_latest
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: tested
    degraded:
      policy_unavailable: local
      adapter_error: host_defined
      timeout: host_defined
    approval: block_and_retry
    verification:
      level: active
      command: rampart verify cline
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/cline_test.go
        kind: unit
        proves: Setup installs direct POSIX and Windows Cline hook artifacts, migrates owned legacy layouts, verifies activation bits, and preserves non-Rampart hooks.
      - path: cmd/rampart/cli/hook_test.go
        kind: unit
        proves: Current editor and CLI envelopes, current tool names, batched commands/files/patches, MCP names, and cancellation responses are handled conservatively.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification checks both installed hook scripts and directly invokes the adapter with a destructive canary that must cancel.
    limitations:
      - The rolling latest-Cline job proves isolated package startup, generated hook shape, and direct adapter denial; it does not prove authenticated host ingestion.
      - Windows .ps1 discovery and PowerShell launch behavior are source-reviewed and cross-build tested, but physical Windows host E2E is pending.
      - Legacy Cline CLI --yolo disables runtime hooks and is incompatible with this boundary.
      - Current upstream Cline advertises --hooks-dir but does not consume that override reliably in file-hook discovery; explicit directories require host confirmation.
      - Current source keeps hook discovery under Documents/Cline/Hooks and CLINE_DIR/hooks; --data-dir and CLINE_DATA_DIR relocate state only, despite broader wording in the CLI README.
      - Unknown custom/plugin pre-call tools deny until Rampart can classify them.
      - Current Cline CLI continues after pre-hook launch, timeout, or control-parse failures; host infrastructure failures are not fail-closed.
      - Current Cline CLI launches post-tool file hooks asynchronously and ignores their control response, so CLI post-tool decisions are audit evidence rather than continuation blocking.
      - Cline has no native Rampart approval-resume path; ask decisions cancel with context.

  - id: codex
    display_name: Codex
    support_tier: supported
    setup_command: rampart setup codex
    boundary: native_hook
    platforms: [linux, macos, windows]
    auto_protect: true
    service_required: false
    upstream_ci: none
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: partial
    degraded:
      policy_unavailable: deny
      adapter_error: host_defined
      timeout: host_defined
    approval: external
    verification:
      level: active
      command: rampart verify codex
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_codex_test.go
        kind: integration
        proves: Codex lifecycle payloads, multi-file patches, and supported deny responses are exercised.
      - path: cmd/rampart/cli/setup_codex_test.go
        kind: unit
        proves: Setup preserves existing hooks, migrates the legacy wrapper, and installs cross-platform commands.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification checks installed hook configuration and directly invokes the adapter with a destructive canary that must deny.
    limitations:
      - The verification command exercises installed configuration and the adapter; it does not invoke a model or prove host hook ingestion.
      - Codex hosted tools and specialized local tool paths that opt out of lifecycle hooks are not covered.
      - Approval actions require rampart serve because Codex PreToolUse does not currently accept an ask decision.
      - Codex controls hook timeout behavior; a host timeout cannot be claimed fail-closed.
      - Physical Windows host ingestion remains unverified.

  - id: hermes
    display_name: Hermes Agent
    support_tier: experimental
    setup_command: rampart setup hermes
    boundary: native_plugin
    platforms: [linux, macos]
    auto_protect: false
    service_required: true
    upstream_ci: rolling_latest
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: not_covered
      subagents: not_covered
    degraded:
      policy_unavailable: deny
      adapter_error: deny
      timeout: deny
    approval: native
    verification:
      level: static
      command: rampart doctor
      safe_canaries: false
      host_boundary: false
    evidence:
      - path: internal/plugin/hermes/test_hermes_plugin.py
        kind: unit
        proves: Tool normalization, redaction, allow, deny, native ask approval identity, malformed responses, unknown-tool fail-closed behavior, adapter exceptions, and service failure are tested.
      - path: scripts/compat-hermes-latest.py
        kind: upstream_latest
        proves: Hermes' official latest stable GitHub release is resolved independently of PyPI and must pass packaged discovery, native approval allow/deny resolution, dispatcher decisions, degraded mode, and multi-path deny-wins behavior in isolation.
    limitations:
      - Hermes documents that a crashing plugin callback is skipped and the agent continues.
      - Native approval/resume requires a Hermes release that exposes the plugin approval directive; older releases block `ask` decisions with an upgrade message.
      - A release that cannot load Hermes' packaged plugin manager fails the rolling compatibility gate and is not inferred compatible from its source tree.
      - Operators may explicitly weaken degraded behavior by configuring selected tools to fail open; the default denies every tool.
      - Hermes tools outside the plugin's typed map, including MCP and delegated-agent tools, fail closed but are not claimed as covered policy surfaces.
      - Delegated-agent and authenticated live-host E2E are not present.

  - id: gemini
    display_name: Gemini CLI
    support_tier: experimental
    setup_command: rampart setup gemini
    boundary: native_hook
    platforms: [linux, macos]
    auto_protect: false
    service_required: false
    upstream_ci: rolling_latest
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: partial
    degraded:
      policy_unavailable: local
      adapter_error: host_defined
      timeout: host_defined
    approval: external
    verification:
      level: active
      command: rampart verify gemini
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_gemini_test.go
        kind: unit
        proves: Documented Gemini tool payloads normalize to policy surfaces, and the complete enforce-mode command path converts unknown future pre-call tools into structured host denials.
      - path: cmd/rampart/cli/setup_gemini_test.go
        kind: unit
        proves: Setup preserves unrelated user settings and hooks, is idempotent, supports clean removal, and refuses malformed configuration by default.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification invokes the real adapter with a destructive canary and requires both a structured denial and session-correlated audit record.
      - path: scripts/compat-gemini-latest.mjs
        kind: upstream_latest
        proves: The latest published Gemini CLI package starts in isolated state while Rampart separately validates its generated settings shape and documented destructive-tool denial schema; hook ingestion is not claimed.
    limitations:
      - This targets Gemini CLI's continuing enterprise, Google Cloud, and paid API-key surface; Antigravity CLI compatibility is not claimed.
      - Gemini CLI is excluded from zero-configuration auto-protection so Antigravity's shared ~/.gemini state cannot be mistaken for an installed Gemini CLI.
      - The ordinary verifier exercises installed configuration and Rampart's adapter, not a real Gemini model/tool invocation.
      - Gemini hooks do not currently expose a native ask result, so approval actions require rampart serve and deny when that service is unavailable.
      - An unexpected hook crash or host timeout follows Gemini CLI behavior and is not claimed fail-closed.
      - Physical Windows host proof and completed authenticated live-host proof are still pending.

  - id: antigravity
    display_name: Antigravity CLI / IDE
    support_tier: supported
    setup_command: rampart setup antigravity
    boundary: native_plugin
    platforms: [linux, macos, windows]
    auto_protect: true
    service_required: false
    upstream_ci: none
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: tested
    degraded:
      policy_unavailable: local
      adapter_error: host_defined
      timeout: host_defined
    approval: native
    verification:
      level: active
      command: rampart verify antigravity
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_antigravity_test.go
        kind: unit
        proves: The documented tool and MCP surfaces map to Rampart policy classes, destructive MCP operations are classified conservatively, unknown future tools deny, and approval decisions use Antigravity force_ask.
      - path: cmd/rampart/cli/setup_antigravity_test.go
        kind: unit
        proves: Setup creates the documented shared CLI/IDE plugin idempotently, validates ownership structurally, removes only Rampart-owned state, and refuses foreign plugin replacement by default.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification requires an installed managed plugin plus a structured destructive-command denial with conversation-correlated audit output.
    limitations:
      - Antigravity's current PostToolUse payload does not include the completed tool call or result, so this integration does not provide post-result secret scanning.
      - Rampart-handled parse and policy failures deny in enforce mode, but unexpected hook-process crashes and host timeouts follow Antigravity behavior and are not claimed fail-closed.
      - The ordinary verifier exercises plugin installation and the live Rampart adapter without invoking a model; it does not prove authenticated host ingestion.
      - A rolling-latest Antigravity compatibility job and physical Windows host proof are still pending.

  - id: copilot
    display_name: GitHub Copilot CLI / VS Code
    support_tier: supported
    setup_command: rampart setup copilot
    boundary: native_hook
    platforms: [linux, macos, windows]
    auto_protect: true
    service_required: false
    upstream_ci: rolling_latest
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: tested
      mcp: tested
      subagents: partial
    degraded:
      policy_unavailable: local
      adapter_error: mixed
      timeout: mixed
    approval: native
    verification:
      level: active
      command: rampart verify copilot
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_copilot_test.go
        kind: unit
        proves: Copilot CLI and VS Code payloads normalize to shared policy surfaces, multi-file writes evaluate every path, unknown future pre-call tools fail closed, and decisions include both host schemas.
      - path: cmd/rampart/cli/setup_copilot_test.go
        kind: unit
        proves: Setup generates the shared cross-platform user hook idempotently, refuses to overwrite foreign files, and removes only Rampart-owned configuration.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification invokes the real adapter with a destructive canary and requires CLI and VS Code denials plus session-correlated audit output.
      - path: scripts/compat-copilot-latest.mjs
        kind: upstream_latest
        proves: The latest published Copilot CLI package starts in isolated state while Rampart separately checks the generated shared hook schema and destructive denial adapter; hook ingestion is not claimed.
    limitations:
      - VS Code agent hooks are an upstream Preview feature and their configuration or behavior may change.
      - Copilot CLI command-hook crashes and non-zero exits fail closed for PreToolUse, but every CLI hook timeout is fail-open, including administrator policy hooks.
      - VS Code blocks on exit code 2 but treats other non-zero exits as warnings; Rampart returns structured decisions with exit code 0, and does not claim unexpected VS Code adapter crashes fail closed.
      - The machine-wide --policy hook is supported by Copilot CLI only; VS Code requires the user hook plus separately managed VS Code enterprise settings and file deployment.
      - User hooks can be modified by the user. Enterprise enforcement requires administrator-owned Copilot CLI policy hooks or OS/MDM controls around the VS Code hook file.
      - The ordinary verifier exercises installed configuration and the Rampart adapter, not an authenticated model/tool invocation through either host.
      - Copilot cloud agent does not load local user or administrator hook files; repository hooks require a separately deployed repository configuration.

  - id: cursor
    display_name: Cursor
    support_tier: supported
    setup_command: rampart setup cursor
    boundary: native_hook
    platforms: [linux, macos, windows]
    auto_protect: true
    service_required: true
    upstream_ci: none
    coverage:
      shell: tested
      file_read: tested
      file_write: tested
      network: partial
      mcp: tested
      subagents: tested
    degraded:
      policy_unavailable: deny
      adapter_error: deny
      timeout: deny
    approval: external
    verification:
      level: active
      command: rampart verify cursor
      safe_canaries: true
      host_boundary: false
    evidence:
      - path: cmd/rampart/cli/hook_cursor_test.go
        kind: unit
        proves: Current preToolUse payloads normalize to policy surfaces, multi-file writes evaluate every path, unknown or ambiguous calls fail closed, and allow leaves Cursor's native permissions intact.
      - path: cmd/rampart/cli/setup_cursor_test.go
        kind: unit
        proves: Setup preserves unrelated user hooks, repairs stale owned entries, installs failClosed behavior, and removes only Rampart-owned configuration.
      - path: cmd/rampart/cli/verify_test.go
        kind: integration
        proves: Active verification checks the installed hook and invokes the real adapter with a destructive canary that must deny and preserve Cursor call identity.
    limitations:
      - The verifier proves installed user configuration and adapter behavior; it does not prove that an authenticated Cursor host loaded or invoked the hook.
      - The user hook covers local Agent Chat and Cmd+K calls that emit preToolUse. Cursor Tab uses separate hooks and is not covered.
      - Cursor Cloud Agents do not load user hooks. Project, team, or enterprise deployment is separate, and early read-only cloud turns currently run without hooks.
      - Cursor Cloud Agents do not currently expose beforeMCPExecution or afterMCPExecution, although generic preToolUse is documented as available once hooks load.
      - Cursor accepts ask in the preToolUse schema but does not enforce it, so approval actions require rampart serve and deny if the service cannot resolve them.
      - Higher-priority enterprise, team, and project hooks remain part of Cursor's host-controlled merge boundary.
      - Physical Windows command-hook ingestion remains unverified.
