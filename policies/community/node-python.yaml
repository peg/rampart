# @name: node-python
# @description: Dev guardrails for Node.js and Python — blocks global installs and eval
# @author: @rampart-team
# @tags: node, python, npm, pip
# @min-rampart: 0.6.0
#
# Rampart Community Policy: Node.js / Python Development
#
# For AI agents writing and testing code in Node.js or Python projects.
# Blocks global installs and eval patterns, requires approval for
# publishing, allows local development freely.
#
# Usage: rampart serve --config policies/community/node-python.yaml

version: "1"
default_action: allow

policies:
  - name: block-global-installs
    priority: 1
    match:
      tool: ["exec"]
    rules:
      - action: deny
        when:
          command_matches:
            - "npm install -g *"
            - "npm i -g *"
            - "pip install --user *"
            - "sudo pip install *"
            - "sudo npm install *"
        message: "Global package install blocked — use project-local deps"

  - name: block-dangerous-eval
    priority: 1
    match:
      tool: ["exec"]
    rules:
      - action: deny
        when:
          command_matches:
            - "node -e *require('child_process')*"
            - "node -e *execSync*"
            - "node -e *exec(*"
            - "python3 -c *import subprocess*"
            - "python3 -c *import os; os.system*"
            - "python -c *import subprocess*"
        message: "Eval with shell access blocked — write a script file instead"

  - name: approve-publish
    priority: 2
    match:
      tool: ["exec"]
    rules:
      - action: ask
        when:
          command_matches:
            - "npm publish*"
            - "yarn publish*"
            - "twine upload *"
            - "pip upload *"
            - "python -m build*"
            - "python3 -m build*"
        message: "Package publish — approve or deny?"

  - name: block-credential-files
    priority: 1
    match:
      tool: ["read"]
    rules:
      - action: deny
        when:
          path_matches:
            - "**/.npmrc"
            - "**/.pypirc"
            - "**/.netrc"
        message: "Registry credential file access blocked"

  - name: protect-env-files
    priority: 1
    match:
      tool: ["read"]
    rules:
      - action: deny
        when:
          path_matches:
            - "**/.env"
            - "**/.env.local"
            - "**/.env.production"
          path_not_matches:
            - "**/.env.example"
            - "**/.env.template"
        message: "Environment file blocked — use .env.example for reference"

tests:
  - name: "blocks global npm installs"
    tool: exec
    params:
      command: "npm install -g suspicious-package"
    expect: deny

  - name: "blocks shell-capable eval"
    tool: exec
    params:
      command: "node -e require('child_process').execSync('id')"
    expect: deny

  - name: "asks before package publish"
    tool: exec
    params:
      command: "npm publish"
    expect: ask

  - name: "blocks registry credential reads"
    tool: read
    params:
      path: "/home/user/project/.npmrc"
    expect: deny

  - name: "blocks dotenv reads"
    tool: read
    params:
      path: "/home/user/project/.env"
    expect: deny

  - name: "allows dotenv templates"
    tool: read
    params:
      path: "/home/user/project/.env.example"
    expect: allow

  - name: "allows project-local installs"
    tool: exec
    params:
      command: "npm install"
    expect: allow
