# @name: terraform
# @description: IaC guardrails for Terraform and OpenTofu
# @author: @rampart-team
# @tags: terraform, iac, opentofu
# @min-rampart: 0.6.0
#
# Rampart Community Policy: Terraform
#
# For AI agents running Terraform / OpenTofu.
# Requires approval for apply and destroy, blocks force-unlock,
# allows plan and state inspection.
#
# Usage: rampart serve --config policies/community/terraform.yaml

version: "1"
default_action: allow

policies:
  - name: block-terraform-destructive
    priority: 1
    match:
      tool: ["exec"]
    rules:
      - action: deny
        when:
          command_matches:
            - "terraform destroy *-auto-approve*"
            - "tofu destroy *-auto-approve*"
            - "terraform force-unlock *"
            - "tofu force-unlock *"
            - "terraform state rm *"
            - "tofu state rm *"
        message: "Destructive Terraform operation blocked — never auto-approve destroy"

  - name: approve-terraform-apply
    priority: 2
    match:
      tool: ["exec"]
    rules:
      - action: ask
        when:
          command_matches:
            - "terraform apply*"
            - "tofu apply*"
            - "terraform destroy*"
            - "tofu destroy*"
            - "terraform import *"
            - "tofu import *"
            - "terraform state mv *"
            - "tofu state mv *"
        message: "Terraform state change — approve or deny?"

  - name: log-terraform-reads
    priority: 10
    match:
      tool: ["exec"]
    rules:
      - action: watch
        when:
          command_matches:
            - "terraform plan*"
            - "tofu plan*"
            - "terraform show*"
            - "tofu show*"
            - "terraform state list*"
            - "tofu state list*"
            - "terraform output*"
            - "tofu output*"
        message: "Terraform diagnostic"

  - name: block-state-exfil
    priority: 1
    match:
      tool: ["exec"]
    rules:
      - action: deny
        when:
          command_matches:
            - "terraform state pull*"
            - "tofu state pull*"
        message: "State pull blocked — contains secrets. Use terraform output for specific values."

tests:
  - name: "blocks auto-approved destroy"
    tool: exec
    params:
      command: "terraform destroy -auto-approve"
    expect: deny

  - name: "blocks raw state extraction"
    tool: exec
    params:
      command: "terraform state pull"
    expect: deny

  - name: "asks before state changes"
    tool: exec
    params:
      command: "terraform apply plan.tfplan"
    expect: ask

  - name: "watches planning"
    tool: exec
    params:
      command: "terraform plan"
    expect: watch

  - name: "allows benign version inspection"
    tool: exec
    params:
      command: "terraform version"
    expect: allow
