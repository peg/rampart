# Rampart built-in profile: guard
#
# Zero-configuration guardrails for unattended agents. This profile layers on
# top of an agent profile (for example openclaw.yaml); it intentionally omits a
# default_action so it does not change the base profile's unmatched behavior.

version: "1"

policies:
  - name: guard-external-changes
    description: "Require approval before publishing, deploying, or changing external systems"
    priority: 20
    match:
      agent: "openclaw:*"
      tool: ["exec"]
    rules:
      - action: ask
        when:
          command_matches:
            - "git push*"
            - "gh pr create*"
            - "gh pr merge*"
            - "gh issue create*"
            - "gh release create*"
            - "docker push*"
            - "kubectl apply*"
            - "kubectl delete*"
            - "kubectl patch*"
            - "kubectl scale*"
            - "kubectl rollout restart*"
            - "terraform apply*"
            - "tofu apply*"
            - "pulumi up*"
        message: "This action changes an external system — approve it before the agent continues"

  - name: guard-privileged-system-changes
    description: "Require approval before privileged or persistent host changes"
    priority: 20
    match:
      agent: "openclaw:*"
      tool: ["exec"]
    rules:
      - action: ask
        when:
          command_matches:
            - "sudo *"
            - "systemctl start*"
            - "systemctl stop*"
            - "systemctl restart*"
            - "systemctl enable*"
            - "systemctl disable*"
            - "service * start*"
            - "service * stop*"
            - "service * restart*"
            - "launchctl load*"
            - "launchctl unload*"
            - "launchctl bootstrap*"
            - "launchctl bootout*"
        message: "This action changes host services or privileges — human approval required"

  - name: guard-message-consequences
    description: "Allow routine replies while requiring approval for cross-conversation or mutating message actions"
    priority: 20
    match:
      agent: "openclaw:*"
      tool: ["message"]
    rules:
      - action: allow
        when:
          tool_param_matches:
            rampart_consequence: "read-only"
        message: "Read-only messaging action allowed"
      - action: allow
        when:
          tool_param_matches:
            rampart_consequence: "routine-reply"
        message: "Reply to the originating conversation allowed"
      - action: ask
        when:
          tool_param_matches:
            rampart_consequence: "external-message"
        message: "The agent wants to contact a different conversation or recipient"
      - action: ask
        when:
          tool_param_matches:
            rampart_consequence: "mutation"
        message: "This messaging action changes external state — human approval required"
      - action: ask
        when:
          tool_param_matches:
            rampart_consequence: "*"
        message: "Unclassified messaging action — human approval required"
