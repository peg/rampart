# Rampart built-in profile: guard
#
# Zero-configuration guardrails for unattended agents. This profile layers on
# top of an agent profile (for example openclaw.yaml); it intentionally omits a
# default_action so it does not change the base profile's unmatched behavior.

version: "1"

policies:
  - name: guard-external-changes
    description: "Require approval before publishing, deploying, or changing external systems"
    priority: 20
    match:
      tool: ["exec"]
    rules:
      # Pushes that rewrite history, delete refs, publish tags, or target a
      # protected branch always ask, whatever the remote.
      - action: ask
        when:
          command_matches:
            - "git push** -f"
            - "git push** -f **"
            - "git push** -uf**"
            - "git push** -fu**"
            - "git push** --force**"
            - "git push** +**"
            - "git push** :**"
            - "git push** -d"
            - "git push** -d **"
            - "git push** --delete**"
            - "git push** --prune**"
            - "git push** --mirror**"
            - "git push** --all**"
            - "git push** --tags**"
            - "git push** --follow-tags**"
            - "git push** --receive-pack**"
            - "git push** --exec**"
            - "git push** tag **"
            - "git push** refs/tags/**"
            - "git push** v[0-9]**"
            - "git push** HEAD"
            - "git push** HEAD **"
            - "git push** main"
            - "git push** main **"
            - "git push**:main"
            - "git push**:main **"
            - "git push**/main"
            - "git push**/main **"
            - "git push** master"
            - "git push** master **"
            - "git push**:master"
            - "git push**:master **"
            - "git push**/master"
            - "git push**/master **"
            - "git push** release/**"
            - "git push**:release/**"
            - "git push**/release/**"
            - "git push** release-**"
            - "git push**:release-**"
        message: "This push rewrites history, deletes or tags refs, or targets a protected branch — approve it before the agent continues"
      # Any other push asks unless it names origin and a branch explicitly
      # (git push [-u] origin <branch>). Bare or remote-only pushes depend on
      # the current branch and upstream, so they still ask.
      - action: ask
        when:
          command_matches:
            - "git push*"
          command_not_matches:
            - "git push origin *"
            - "git push -u origin *"
            - "git push --set-upstream origin *"
        message: "This action changes an external system — approve it before the agent continues"
      - action: ask
        when:
          command_matches:
            - "gh pr create*"
            - "gh pr merge*"
            - "gh issue create*"
            - "gh release create*"
            - "docker push*"
            - "npm publish*"
            - "pnpm publish*"
            - "yarn npm publish*"
            - "docker compose up*"
            - "docker compose down*"
            - "docker compose restart*"
            - "docker-compose up*"
            - "docker-compose down*"
            - "docker-compose restart*"
            - "kubectl apply*"
            - "kubectl delete*"
            - "kubectl patch*"
            - "kubectl scale*"
            - "kubectl rollout restart*"
            - "terraform apply*"
            - "tofu apply*"
            - "pulumi up*"
        message: "This action changes an external system — approve it before the agent continues"

  - name: guard-privileged-system-changes
    description: "Require approval before privileged or persistent host changes"
    priority: 20
    match:
      tool: ["exec"]
    rules:
      - action: ask
        when:
          command_matches:
            - "sudo *"
            - "systemctl start*"
            - "systemctl stop*"
            - "systemctl restart*"
            - "systemctl enable*"
            - "systemctl disable*"
            - "service * start*"
            - "service * stop*"
            - "service * restart*"
            - "launchctl load*"
            - "launchctl unload*"
            - "launchctl bootstrap*"
            - "launchctl bootout*"
        message: "This action changes host services or privileges — human approval required"

  - name: guard-credential-shell-access
    description: "Block shell utilities from reading private credentials or Rampart authority files"
    priority: 5
    match:
      tool: ["exec"]
    rules:
      - action: deny
        when:
          command_matches:
            - "cat **/.ssh/id_*"
            - "head **/.ssh/id_*"
            - "tail **/.ssh/id_*"
            - "less **/.ssh/id_*"
            - "more **/.ssh/id_*"
            - "base64 **/.ssh/id_*"
            - "xxd **/.ssh/id_*"
            - "hexdump **/.ssh/id_*"
            - "od **/.ssh/id_*"
            - "strings **/.ssh/id_*"
            - "cat **/.rampart/token"
            - "head **/.rampart/token"
            - "tail **/.rampart/token"
            - "base64 **/.rampart/token"
            - "cat **/.aws/credentials"
            - "cat **/.git-credentials"
            - "cat **/.netrc"
            - "cat **/.env"
            - "cat **/.env.*"
        message: "Credential and Rampart authority files cannot be read through shell execution"

  - name: guard-external-network-exec
    description: "Require approval for direct external curl and wget; downloads piped into a shell stay denied by the base profile"
    priority: 10
    match:
      tool: ["exec"]
    rules:
      - action: ask
        when:
          command_matches:
            - "curl **"
            - "wget **"
          command_not_matches:
            - "curl http://localhost**"
            - "curl https://localhost**"
            - "curl http://127.0.0.1**"
            - "curl https://127.0.0.1**"
            - "wget http://localhost**"
            - "wget https://localhost**"
            - "wget http://127.0.0.1**"
        message: "This command contacts an external host — approve it before the agent continues"

  # Routine project commands pass: running a script file (python3 app.py,
  # node index.js), package scripts (npm run/test/ci, pnpm, yarn), make, and
  # installs from the lockfile or a requirements file. Inline code, remote
  # package runners, and installing a package by name still ask.
  - name: guard-opaque-execution
    description: "Require approval for inline code, remote package runners, new package installs, and container or cluster commands"
    priority: 20
    match:
      tool: ["exec"]
    rules:
      - action: ask
        when:
          command_matches:
            # Interpreter flags (-c, -e, -m, -r, --import, ...) and stdin
            # input. A script file as the first argument passes.
            - "python -*"
            - "python <*"
            - "python3 -*"
            - "python3 <*"
            - "node -*"
            - "node <*"
            - "bash -c **"
            - "bash -lc **"
            - "sh -c **"
            - "sh -lc **"
            - "zsh -c **"
            - "zsh -lc **"
            # Remote package runners and project generators.
            - "npx"
            - "npx *"
            - "npm exec*"
            - "npm x"
            - "npm x *"
            - "npm create*"
            - "npm init *"
            - "pnpm dlx*"
            - "pnpm create*"
            - "yarn dlx*"
            - "yarn create*"
            # Installing a package by name (npm accepts these install aliases).
            - "npm install *"
            - "npm i *"
            - "npm in *"
            - "npm ins *"
            - "npm inst *"
            - "npm insta *"
            - "npm instal *"
            - "npm isnt *"
            - "npm isnta *"
            - "npm isntal *"
            - "npm isntall *"
            - "npm add *"
            - "npm install-test *"
            - "npm it *"
            - "pnpm add*"
            - "pnpm install *"
            - "pnpm i *"
            - "yarn add*"
            - "yarn global*"
            # Options before the subcommand hide which subcommand runs.
            - "npm -*"
            - "pnpm -*"
            - "yarn -*"
            - "kubectl apply**"
            - "kubectl config**"
        message: "This command can conceal arbitrary code or external side effects — approval required"
      # pip installs ask unless they install from a requirements file or the
      # current project.
      - action: ask
        when:
          command_matches:
            - "pip install*"
            - "pip3 install*"
            - "pip -*"
            - "pip3 -*"
          command_not_matches:
            - "pip install -r *.txt"
            - "pip install -r */*.txt"
            - "pip install -e ."
            - "pip install ."
            - "pip3 install -r *.txt"
            - "pip3 install -r */*.txt"
            - "pip3 install -e ."
            - "pip3 install ."
        message: "This command installs a package by name — approval required"
      # Compose commands that only read state pass; anything that runs,
      # creates, or removes containers asks.
      - action: ask
        when:
          command_matches:
            - "docker compose**"
            - "docker-compose**"
          command_not_matches:
            - "docker compose ps*"
            - "docker compose logs*"
            - "docker compose config*"
            - "docker compose images*"
            - "docker compose ls*"
            - "docker compose top*"
            - "docker compose version*"
            - "docker compose port*"
            - "docker compose build*"
            - "docker-compose ps*"
            - "docker-compose logs*"
            - "docker-compose config*"
            - "docker-compose images*"
            - "docker-compose ls*"
            - "docker-compose top*"
            - "docker-compose version*"
            - "docker-compose port*"
            - "docker-compose build*"
        message: "This command can conceal arbitrary code or external side effects — approval required"

  - name: guard-message-consequences
    description: "Allow routine replies while requiring approval for cross-conversation or mutating message actions"
    priority: 20
    match:
      tool: ["message"]
    rules:
      - action: allow
        when:
          tool_param_matches:
            rampart_consequence: "openclaw:read-only"
        message: "Read-only messaging action allowed"
      - action: allow
        when:
          tool_param_matches:
            rampart_consequence: "openclaw:routine-reply"
        message: "Reply to the originating conversation allowed"
      - action: ask
        when:
          tool_param_matches:
            rampart_consequence: "openclaw:external-message"
        message: "The agent wants to contact a different conversation or recipient"
      - action: ask
        when:
          tool_param_matches:
            rampart_consequence: "openclaw:mutation"
        message: "This messaging action changes external state — human approval required"
      - action: ask
        when:
          tool_param_matches:
            rampart_consequence: "openclaw:*"
        message: "Unclassified messaging action — human approval required"

  # The canary `rampart protect` asks a newcomer to try. It is denied here so
  # the first test shows Rampart working, and it is harmless when no hook
  # intercepts it: the shell only prints the word.
  - name: guard-protect-canary
    description: "Deny the harmless protect canary so a new user can see the boundary work"
    priority: 1
    match:
      tool: ["exec"]
    rules:
      - action: deny
        when:
          command_matches:
            - "echo rampart-canary"
        message: "Rampart canary: protection is active (this harmless test command is denied on purpose)"
